<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>PhotoNest</title>
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/fontello/css/fontello.css" />
    <link rel="stylesheet" type="text/css" href="./templ/themes/default/js/plugins/selectize/selectize.dark.css" />
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/fonts/open-sans/open-sans.css" />
    <link rel="stylesheet" type="text/css" href="./templ/themes/default/u3.black.css" />
    <link rel="stylesheet" type="text/css" href="./templ/themes/default/skins/strawberry_jam.css" id="skin" />
    <style type="text/css">
        .selectize-input {
            padding: 4px 8px;
        }
    </style>

</head>
<body id="theColorPage" style="overflow:hidden;" class="thedark">

    <div id="catModify" style="padding-top:5px;text-align: left;	margin-left: 50px;" class="delete_popin">
        <p>
            <div>
                <select data-selectize="tags" data-value=""
                        placeholder="{'Type in a search term'|@translate}"
                        data-create="true" name="add_tags" multiple style="width:450px; "></select>
            </div>
        </p>

    </div>
    <center>
        <p class="popin-actions" style="margin-top:50px;">
            <a class="filter-validate" href="javascript:;" onclick="add_tags();return false;">
                {'OK'|@translate}
            </a>
            <a class="cancelbtn" href="javascript:;" onclick="cancel(); return false;">
                {'Cancel'|@translate}
            </a>
        </p>
    </center>
    <script type="text/javascript" src="./templ/themes/default/js/jquery.min.js"></script>
    <script type="text/javascript" src="./templ/themes/default/js/plugins/selectize/selectize.min.js"></script>
    <script type="text/javascript">
        var _readonly = "{$readonly}";
        var _ids = "{$ids}";
        var _lang = "{'Create'|@translate}";

        function add_tags() {
            var v = _control.getValue();

            var body = "&photos=" + _ids;
            body += "&add_tags=" + encodeURIComponent(v);
            var url = "./ws.php?method=batch.append_tags";

            $.ajax({
                type: "POST",
                dataType: "text",
                url: url,
                data: body,
                success: function (result) {
                    $('#menubar_tags', window.parent.document).remove();
                    $('#menubar_categories', window.parent.document).after(result);
                    parent.$.colorbox.close();
                }
            });
        }

        function cancel() {
            parent.$.colorbox.close();
        }

        function tag_selectize() {
            var $area = $('[data-selectize=tags]').selectize({
                valueField: 'id',
                labelField: 'name',
                sortField: 'name',
                searchField: ['name'],
                plugins: ['remove_button'],
                create: (_readonly == "0") ? true : false,
                render: {
                    'option_create': function (data, escape) {
                        return '<div class="create">' + _lang + ' <strong>' + data.input + '</strong>&hellip;</div>';
                    }
                }
            });
            _control = $area[0].selectize;
            add_tag_opt(0);
        }

        function add_tag_opt(type) {
            $.getJSON('./ws.php?format=json&method=tags.getAdminList', function (data) {
                for (var i = 0; i < data.result.tags.length; i++) {
                    var tags = data.result.tags[i];

                    _control.addOption({
                        id: '~~' + tags.id + '~~',
                        name: tags.name + '(' + tags.nb_images + ')',
                        fullname: tags.name
                    });
                }
            });
        }

        $(document).ready(function () {
            tag_selectize();
        })
    </script>
</body>
</html>
