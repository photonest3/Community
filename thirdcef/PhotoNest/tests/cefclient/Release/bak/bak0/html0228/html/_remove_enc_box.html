<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>PhotoNest</title>
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/fontello/css/fontello.css" />
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/fonts/open-sans/open-sans.css" />
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/u3.theme.css" />
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/u3.admin_add.css" />
    <style type="text/css">
        .td_right {
            text-align: right;
        }

        .popin-actions {
            margin-top: 30px;
        }

        body, h3, dt, h2, .throw, .content, label, LEGEND {
            color: #333;
        }

        .fileupload-process {
            margin-top: 15px;
            display: inline-block;
        }

        .selectFiles, .progress-extended, .fileupload-progress {
            margin-left: 20px;
            margin-right: 20px;
        }
    </style>
</head>
<body style="background-color: #fff; min-width: 300px; color: #000; overflow-x: hidden;">
    <div style="padding-top: 10px;">
        <p id="titie" style="height: 50px; margin-top: 50px; word-break: break-all; padding: 0 10px;">
        </p>
        <div class="progress-extended fileupload-process" style="height: 30px; margin-top: 0;">
            &nbsp;
        </div>
        <div class=" fileupload-progress fade" style="height: 20px;">
            <div id="progressbarall" class="progress progress-striped active" aria-valuemin="0"
                 aria-valuemax="100" style="display: none;">
                <div class="progress-bar progress-bar-success" style="width: 0%;">
                </div>
            </div>
        </div>
        <div id="cont" style="height: 40px;">
            <p class="popin-actions" style="margin-top: 10px;">
                <a id="deleteConfirm" class="buttonLike" href="javascript:;" onclick="remove2();return false;">
                    <i class="icon-ok"></i>{'Confirm Removal'|@translate}
                </a><span id="deteleLoading"
                          style="display: none">
                    <img src="./templ/themes/default/images/ajax-loader-small.gif" />
                </span><a class="icon-cancel-circled close-delete_popin" href="javascript:;" onclick="cancel2();return false;">
                    {'Cancel'|@translate}
                </a>
            </p>
        </div>
    </div>
    <script type="text/javascript" src="./templ/themes/default/js/jquery.min.js"></script>
    <script>
        var _rootid = "{$rootid}";
        var _folder = "{$folder}";
        var _album = "{$album}";

        function remove2() {
            $(".buttonLike").css("pointer-events", "none");
            $(".buttonLike").css("color", "#eee");
            $(".buttonLike").css("background-color", "#999");

            $('.progress-extended').show();
            $('#progressbarall').show();

            var interval = setInterval(function () {
                $.post("./ws.php?method=ws.progress", "0", function (data, state) {
                    var info = $.parseJSON(data);
                    if (info.stat == "ok") {
                        var len = parseInt(info.len);
                        var step = parseInt(info.step);
                        if (step >= len) {
                            clearInterval(interval);
                        }
                        else {
                            progressall(step, len);
                            if (info.real == "ok") {
                                $('.progress-extended').html(step + ' / ' + len);
                            }
                        }
                    }
                });
            }, 100);

            $.post("./ws.php?method=galleries.remove", "rootid=" + _rootid, function (data, state) {
                var info = $.parseJSON(data);
                if (info.stat == "ok") {
                    window.cefQuery({
                        request: 'Prompt.q.syn_root:'
                    });

                    clearInterval(interval);
                    $('.progress-extended').hide();
                    $('#progressbarall').hide();

                    parent.location.reload();
                    parent.$.colorbox.close();
                }
            });
        }

        function cancel2() {
            parent.$.colorbox.close();
        }

        function progressall(step, len) {
            var progress = Math.floor(step * 100 / len);
            $('.fileupload-progress')
                .find('.progress')
                .attr('aria-valuenow', progress)
                .children()
                .first()
                .css('width', progress + '%');
        }

        $(document).ready(function () {
            $('#titie').html("{'Directory'|@translate}: '" + _folder + "'");
        });

    </script>
</body>
</html>
