    <script type="text/javascript" src="./templ/themes/default/js/jquery.min.js"></script>

    <script type="text/javascript">
        var _lang = "{'Create'|@translate}";
        var _readonly = "{$readonly}";
        var _err_readonly = "{$error_readonly}";
        var _control;
var _err_alb = "{'The album name must not be empty.'|@translate}";

        function addto() {
            if (_readonly != "0") {
            //  //  $("#info").html(_err_readonly);
            //    $('#info').delay(100).show();
             //   $('#info').delay(2000).fadeOut();
				jQuery('#categoryNameError0').html(_err_readonly);
                   jQuery('#categoryNameError0').css("visibility", "visible");
             return;
            }

          //  $('#info').html("");
          //  $('#info').css('display', 'none');
            var catid = _control.getValue();
            jQuery('#categoryNameError0').css("visibility", "hidden");

            if ($.trim(catid) == "") {
 				jQuery('#categoryNameError0').html(_err_alb);
               jQuery('#categoryNameError0').css("visibility", "visible");
            }
            else {
                $(".filter-validate").attr("disabled", "true");
                $.get("./albbox.html?type=add&category=" + encodeURIComponent(catid) + "&src=" + parent.getSrc(), function (info, state) {
                    var data = jQuery.parseJSON(info);
                    var vv = '<i class="eiw-icon icon-ok"></i>';
                    if (data.stat == 'error') {
                       // $('#info').html(data.message);
    				jQuery('#categoryNameError0').html(data.message);
                 }
                    else {
                        $('#info').html(vv + "{'Saved successfully'|@translate}");
          				jQuery('#categoryNameError0').html("{'Saved successfully'|@translate}");
                  var v = "~~" + data.result.category + "~~";
                        _control.clearOptions();
                        add_alb_opt(v);
                    }

                   // $('#info').show();
                   // $('#info').fadeOut(3000);
                    $(".filter-validate").removeAttr("disabled");
                });
            }
        }

        function jumpto() {
            var cid = "";
            var catid = _control.getValue();
            if (catid.indexOf("~~") >= 0) {
                cid = catid.substr(2, catid.length - 4);
            }

            window.cefQuery({
                request: 'Prompt.q.jumpto:' + cid
            });

            window.cefQuery({
                request: 'Prompt.q.disabledrag:0'
            });

            parent.$.colorbox.close();
        }

        function alb_selectize() {
            var $area = $('[data-selectize=categories]').selectize({
                valueField: 'id',
                labelField: 'name',
                sortField: 'name',
                searchField: ['name'],
                plugins: ['remove_button'],
                create: (_readonly == "0") ? true : false,
                render: {
                    'option_create': function (data, escape) {
                        return '<div class="create">' + _lang + ' <strong>' + data.input + '</strong>&hellip;</div>';
                    }
                },
                onChange(value) {
                    jQuery('#categoryNameError0').css("visibility", "hidden");
                },
                onOptionAdd(value, data) {
                    jQuery('#categoryNameError0').css("visibility", "hidden");
                }
            });
            _control = $area[0].selectize;
            add_alb_opt("");

        }


        function add_alb_opt(val) {
            $.getJSON('./ws.php?format=json&method=categories.getAdminList&type=1', function (data) {
                var v = "";
                for (var i = 0; i < data.result.categories.length; i++) {
                    var cats = data.result.categories[i];

                    v = "~~" + cats.id + "~~";
                    _control.addOption({
                        id: v,
                        name: cats.fullname,
                        fullname: cats.fullname
                    });
                }

                if (val != "") {
                    setTimeout(function () {
                        _control.setValue(val);
                    }, 0);
                }

            });
        }

        $(document).ready(function () {
            alb_selectize();
            jQuery('.font-checkbox').fontCheckbox();

        })

    </script>
