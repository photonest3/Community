    <script type="text/javascript">

        jQuery.fn.fontCheckbox = function () {
            this.find('input[type=checkbox]').each(function () {
                if (!jQuery(this).is(':checked')) {
                    jQuery(this).prev().toggleClass('icon-check icon-check-empty');
                }
            });
            this.find('input[type=checkbox]').on('change', function () {
                jQuery(this).prev().removeClass();
                if (!jQuery(this).is(':checked')) {
                    jQuery(this).prev().addClass('icon-check-empty');
                }
                else {
                    jQuery(this).prev().addClass('icon-check');
                }
            });

            this.find('input[type=radio]').each(function () {
                if (!jQuery(this).is(':checked')) {
                    jQuery(this).prev().toggleClass('icon-dot-circled icon-circle-empty');
                }
            });
            this.find('input[type=radio]').on('change', function () {
                jQuery('.font-checkbox input[type=radio][name="' + jQuery(this).attr('name') + '"]').each(function () {
                    jQuery(this).prev().removeClass();
                    if (!jQuery(this).is(':checked')) {
                        jQuery(this).prev().addClass('icon-circle-empty');
                    }
                    else {
                        jQuery(this).prev().addClass('icon-dot-circled');
                    }
                })
            });
        };









        var _readonly = 0;
        var _def = "{$skin}";
        var _sel_bg = "{$sel_bg}";
        var _custom_bg = "{$custom_bg}";
        var _custom_path = "{$custom_path}";

        function change_bg(ty) {
            $.post("./ws.php?method=ws.bg&id=" + ty, "bg", function (data, state) {
                var info = $.parseJSON(data);
                if (info.stat == "ok") {
                    if (ty == '-1') {
                        parent._bg = "";
                        parent.clear_bg2();
                    }
                    else {
                        var bg = info.bg + " center fixed no-repeat border-box ";
                        parent.set_bg2(bg);
                    }
                }
            });
        }

        jQuery(document).ready(function () {
            var obj = $("input[name='skin'][value=" + _def + "]");
            obj.prop("checked", true);
            jQuery(obj).parents(".themeBoxModusConfig").addClass("themeDefault");

            $("input[value='" + _sel_bg + "']").attr("checked", "checked");

            if (_custom_bg == "") {
                $("#c0").hide();
            }
            else {
                $("#c1").html(_custom_bg);
            }
            $('.font-checkbox').fontCheckbox();


            jQuery("input[name='skin']").change(function () {
                if (_readonly != "0") {
                    return false;
                }
                jQuery("input[name='skin']").parents(".themeBoxModusConfig").removeClass("themeDefault");
                jQuery(this).parents(".themeBoxModusConfig").addClass("themeDefault");
                submitclick();
            });

            $("input[name='use_bg']").change(function () {
                if (_readonly != "0") {
                    return false;
                }

                change_bg($(this).val());
            });


            $("#only_header").change(function () {
                if (_readonly != "0") {
                    return false;
                }
                parent.clear_bg2();

                if ($(this).is(':checked')) {
                    parent._bgtype = 1;
                }
                else {
                    parent._bgtype = 0;
                }
                $.post("./ws.php?method=ws.bg&bgtype=" + parent._bgtype, "bg", function (data, state) {
                    var info = $.parseJSON(data);
                    if (info.stat == "ok") {
                        var s = $("input[name='use_bg']").filter(':checked').val();
                        change_bg(s);
                    }
                });

            });
        });

        function submitclick() {
            var body = $("#form1").serialize();
            $.post("./ws.php?method=ws.skins", body, function (data, state) {
                var info = $.parseJSON(data);
                if (info.stat == "ok") {
                    var s = $("input[name='skin']").filter(':checked').val();
                    parent._skin = s;
                    var c = document.getElementById("skin");
                    c.setAttribute("href", "./templ/themes/default/skins/" + s + ".css");

                    var c1 = parent.document.getElementById("skin");
                    c1.setAttribute("href", "./templ/themes/default/skins/" + s + ".css");

                    parent.clear_bg2();

                    if ($("#only_header").is(':checked')) {
                        parent._bgtype = 1;
                    }
                    else {
                        parent._bgtype = 0;
                    }
                    $.post("./ws.php?method=ws.bg&bgtype=" + parent._bgtype, "bg", function (data, state) {
                        var info = $.parseJSON(data);
                        if (info.stat == "ok") {
                            var s = $("input[name='use_bg']").filter(':checked').val();
                            change_bg(s);
                        }
                    });
                }
                else {
                    parent.$.colorbox.close();
                }
            });
        }

        function selfol() {
            window.cefQuery({
                request: 'Prompt.q.folder:100'
            });
        }
        function selfol2(obj) {
            window.cefQuery({
                request: 'Prompt.q.file:' + _custom_path
            });
        }
