<form method="post" id="delTagForm" action="" onsubmit="delTagForm_submit(); return false;">
    <div class="DeleteAlbumPopInContainer">
        <div class="RenameTagPopInContainer">
            <input type="hidden" name="tags" value="{$values}" />
            <input type="hidden" name="names" value="{$name}" />
            <input type="hidden" name="sel" value="{$sel}" />
            <div class="DeleteIconTitle" title="{$name}">
                <span>{'Delete tag'|@translate} "{$name}"?</span>
            </div>
            <div class="RenameTagInputContainer" style="text-align: center;">
                <div class="jconfirm-content"><span>{'Are you sure to continue?'|@translate}</span></div>
            </div>
          
            <div class="DeleteAlbumFormValidation">
                <div class="DeleteAlbumSubmit" onclick="delTagForm_submit();return false;">
                    <span>{'Confirm deletion'|@translate}</span>
                </div>

                <div class="DeleteAlbumCancel" onclick="btn_cancel();return false;">
                    <span>{'Cancel'|@translate}</span>
                </div>
            </div>
        </div>
    </div>

</form>
