        var _init = parseInt('{$init}');

        var _err_readonly = "{$error_readonly}";
        var _delay = 0;
        var _nbPage = parseInt('{$nbPage}');
        var _updated = 0;
        var _vrsize = parseInt('{$vrsize}');
        var _in = 0;
        var _control;
        var _metadata = "{$metadata}";
        var _osm = "{$osm}";
        var _tit20 = "{'Delete'|@translate}";
        var _currpicid = "";

        var _sl = 0;

</head>
<body id="theColorPage" class="topbar-float clear thepic">

    <div class="viewer-clock">
        <span class="viewer-clock-btn">
            <a href="javascript:;" onclick="speed(1);return false;" title="{'Reduce slideshow speed'|@translate}" class="icon-fast-bw"></a>
            <span id="speedv" style="margin: 0 20px;">3s</span>
            <a href="javascript:;" onclick="speed(-1);return false;" title="{'Increase slideshow speed'|@translate}" class="icon-fast-fw"></a>
        </span>
    </div>

    <div class="sb-site-container thepic">
        <div style="background: transparent;">
            <header class="header" style="display: block; opacity: 1;">
                <div id="nav-wrapper" class="nav-wrapper" style="transform: translateY(0px);">
                    <nav class="nav">
                        <div class="titrePage0" id="imageHeaderBar">
                            <div class="imageNumber">
                                <span id="photos" style="margin-right:5px;"></span><span id="albumCreationLoading" style="display:none;">
                                    <img src="./templ/themes/default/images/load50.gif" />
                                </span>
                            </div>
                            <div class="browsePath0" style="display:none;">
                                <div id="tit0" style="display: none;">{$title}</div>
                                <span id="filename"></span>
                            </div>
                        </div>
                        <div class="actionButtons">
                            {$actionButtons}
                        </div>
                        <div class="ooo">
                            <div id="err" class="errors"></div>
                        </div>
                        {$error_lic}
                    </nav>
                </div>
            </header>
        </div>
    </div>
    {$calendar_nav}
    <div id="theImage0" style="display: none;">
        {$picture_content}
    </div>
    <div id="tabcontent">
        <span class="tabcontenttag">{'Tags'|@translate}</span>
        <div id="tabtags" style="display: block;">
            <select data-selectize="tags" data-value="" placeholder="{'Type in a search term'|@translate}"
                    data-create="true" name="add_tags" multiple style="width: 200px;"></select>
        </div>
        <div id="zzz" style="margin-top: 5px;">
            <div class="table-striped c1">
                <table id="striped" cellpadding="2" cellspacing="2" style="width: 100%; margin-top: 0;">
                    <tbody style="vertical-align: top; -webkit-user-select: text;"></tbody>
                </table>
            </div>
        </div>
    </div>
    <a id="down" href="javascript:;" style="display: none;">{'Export'|@translate}</a>
    <!--  <a id="del_box" class="del_box" href="javascript:;" style="display: none;"></a>-->

    <script type="text/javascript" src="./templ/themes/default/js/plugins/selectize/selectize.min.js"></script>
    <script type="text/javascript" src="./templ/themes/default/js/plugins/colorbox/jquery.colorbox.js"></script>
    <script type="text/javascript" src="./templ/themes/default/js/plugins/viewer/js/viewer.u3.min.js"></script>
    <script type="text/javascript" src="./jquery.watermark_img.js"></script>
    <script type="text/javascript" src="./_picture.js" charset="utf-8"></script>
    <script type="text/javascript">
        function vv() {
            $('#myimg').watermark({
                text: "{'Activation Expired'|@translate}",
                textWidth: 800,
                opacity: 0.5,
                gravity: 'c',
                textSize: 64
            });
        }

        function stopv() {
            if ($("#myimg").length > 0) {
                _vr.stop();
            }
            else {
                document.webkitExitFullscreen();
            }
        }
    </script>
</body>
</html>
