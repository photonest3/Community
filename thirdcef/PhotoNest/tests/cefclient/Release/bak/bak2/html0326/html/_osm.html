    <script type="text/javascript">
        var _vr_mask = 0;
        function jshow_mask(ty) {
            var ifm = document.getElementsByClassName("cboxIframe");
            if (ifm.length > 0) {
                var src = ifm[0].src;
                if (src.indexOf("/picture.html") >= 0) {
                    $('#cboxClose').hide();
                    ifm[0].contentWindow.jshow_mask(ty);
                }
            }

        }

        function myreload() {
            if (_vr_mask == 1) {
                return;
            }
            $.colorbox.close();

        }



        function mygoback() {
            if (_vr_mask == 1) {
                return;
            }
            $.colorbox.close();
        }

        function pp(obj) {
            $.colorbox({
                transition: "none", width: "100%", height: "100%", fixed: true, iframe: true, close: true, opacity: .7, //maxWidth: 1140,
                href: function () {
                    return $(obj).attr('uri');
                },
                onComplete: function () {
                    // $('#cboxLoadedContent').css('padding', '0');
                    parent._pic = 1;
                    $('#cboxClose').addClass('colse-map');
                    $('#cboxClose').show();
                    parent.$('#cboxClose').removeClass('colse-map');

                },
                onClosed: function () {
                    parent._pic = 0;

                    setTimeout(function () {
                        parent.$('#cboxClose').addClass('colse-map');
                    }, 1000);

                    //  $('#cboxContent').css('margin-top', '32px');
                    //  $('body').css('overflow-y', 'auto');
                    // $('#cboxClose').removeClass('colse-map');
                }
            });
        }
        function jshow_close() {
            var ifm = document.getElementsByClassName("cboxIframe");
            if (ifm.length > 0) {
                var src = ifm[0].src;
                if (src.indexOf("/picture.html") >= 0) {
                    $('#cboxClose').show();
                    ifm[0].contentWindow.jshow_close();
                    return;
                }
            }
            $.colorbox.close();
        }


        function toggle(arrow) {
            var el = document.getElementById("ribbon-map-toggle");
            var box = el.getAttribute("class");
            if (box == "hide") {
                el.setAttribute("class", "show");
                $(arrow).children(".ToolTip").html("&lsaquo;");
                el.removeAttribute("style");
            }
            else {
                el.setAttribute("class", "hide");
                el.setAttribute("style", "visibility:hidden;width:0px;");
                $(arrow).children(".ToolTip").html("&rsaquo;");
            }
        }
    </script>
    <script type="text/javascript">
        var addressPoints = $addressPoints;
        var Url = 'http://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
            Attribution = '',
            TileLayer = new L.TileLayer(Url, { maxZoom: 18, noWrap: false, attribution: Attribution }),
            latlng = new L.LatLng(0, 0);
        var map = new L.Map('map', { worldCopyJump: true, center: latlng, zoom: 2, layers: [TileLayer], contextmenu: true });
        map.attributionControl.setPrefix('');
        var MarkerClusterList = [];
        if (typeof L.MarkerClusterGroup === 'function')
            var markers = new L.MarkerClusterGroup();

        L.control.scale().addTo(map);
        for (var i = 0; i < addressPoints.length; i++) {
            var a = addressPoints[i];
            latlng = new L.LatLng(a[0], a[1]);
            var title = a[2];
            var pathurl = a[3];
            var imgurl = a[4];
            var u2 = a[5];
            var width = a[6];
            var marker = new L.Marker(latlng, { title: title });

            var myinfo = "";
            // myinfo = '<div id="thumb-' + i + '"><p>' + title + '<br /><img src="' + pathurl + '"></p></div>';
            myinfo = '<div id="thumb-' + i + '"><p>' + title + '<br /><a class="coi-box" href="javascript:;" uri="' + imgurl + '" onclick="pp(this);return false;" ><img src="' + pathurl + '"></a></p></div>';

            marker.bindPopup(myinfo, { minWidth: '+width+' });

            if (typeof L.MarkerClusterGroup === 'function')
                markers.addLayer(marker);
            else
                map.addLayer(marker);
            MarkerClusterList.push(marker);
        }
        if (typeof L.MarkerClusterGroup === 'function')
            map.addLayer(markers);
    </script>
    <script type="text/javascript">

        L.Map.prototype.panToOffset = function (latlng, offset, options) {
            var x = this.latLngToContainerPoint(latlng).x - offset[0];
            var y = this.latLngToContainerPoint(latlng).y - offset[1];
            var point = this.containerPointToLatLng([x, y]);
            return this.setView(point, this._zoom, { pan: options })
        };

        function goHome() {
            location.assign('./index.html');
        }

        function goBack() {
            location.assign('{$HOME_PREV}');
        }

        function showCoordinates(e) {
            var popup = L.popup();
            popup
                .setLatLng(e.latlng)
                .setContent("{'CLICKED_MAP'|@translate}" + e.latlng.toString())
                .openOn(map);
        }

        function centerMap(e) {
            map.panTo(e.latlng);

            setTimeout(function () {
                getMarkers();
            }, 1);
        }

        function zoomIn(e) {
            map.zoomIn();
        }

        function zoomOut(e) {
            map.zoomOut();
        }

        map.contextmenu.addItem({ text: "{'HOME_PREV_NAME'|@translate}", iconCls: 'osm-left-big', callback: cclose });
        map.contextmenu.addItem('-');
        map.contextmenu.addItem({ text: "{'SHOW_COORD'|@translate}", iconCls: 'osm-pin', callback: showCoordinates });
        map.contextmenu.addItem({ text: "{'CENTER_MAP'|@translate}", iconCls: 'osm-location', callback: centerMap });
        map.contextmenu.addItem('-');
        map.contextmenu.addItem({ text: "{'ZOOM_IN'|@translate}", iconCls: 'osm-zoom-in', callback: zoomIn });
        map.contextmenu.addItem({ text: "{'ZOOM_OUT'|@translate}", iconCls: 'osm-zoom-out', callback: zoomOut });

        map.on('moveend', onMapMove);

        function onMapMove(e) {
            setTimeout(function () {
                getMarkers();
            }, 1);

        }

        function getMarkers() {
            var bounds = map.getBounds();
            var min = bounds.getSouthWest().wrap();
            var max = bounds.getNorthEast().wrap();

            removeChildren({ parentId: 'jcarousel-thumb' });

            var nb_items = 0;
            for (var i = 0; i < addressPoints.length; i++) {
                var a = addressPoints[i];

                if (a[0] > min.lat && a[1] > min.lng && a[0] < max.lat && a[1] < max.lng) {
                    var u2 = a[5];
                    var li_elem = document.createElement("li");
                    var img_elem = document.createElement("img");
                    img_elem.setAttribute("id", "jcarousel-img");
                    img_elem.setAttribute("width", "40");
                    img_elem.setAttribute("height", "40");
                    img_elem.setAttribute("onclick", "OnThumbClick(" + i + ")");
                    img_elem.setAttribute("class", "morph pic");
                    img_elem.src = u2;
                    document.getElementById("jcarousel-thumb").appendChild(li_elem).appendChild(img_elem);
                    nb_items++;
                }
            }

            document.getElementById("nb_showall").innerHTML = nb_items + " {'items'|@translate}";

            if (nb_items > 0) {
                var nb_items_width = nb_items * 45;
                var document_width = $(document).width() - 200;
                var nav_width = document.getElementById('ribbon-map-nav').offsetWidth;
                var results_width = document.getElementById('ribbon-map-results').offsetWidth;
                var location_width = 0;
                var wrapper_width = parseInt(nav_width) + parseInt(results_width) + parseInt(location_width) + 150;
                var jcarousel_width = 0;

                if (parseInt(nb_items_width) <= (parseInt(document_width) - parseInt(wrapper_width))) {
                    jcarousel_width = nb_items_width;
                    document_width = parseInt(nav_width) + parseInt(results_width) + parseInt(location_width) + parseInt(nb_items_width) + 150;
                } else {
                    jcarousel_width = parseInt(document_width) - (parseInt(nav_width) + parseInt(results_width) + parseInt(location_width) + 200);
                    document_width = parseInt(document_width) - 50;
                }

                document.getElementById('ribbon-map').setAttribute('style', 'width:' + document_width + 'px;');
                document.getElementById('jcarousel-wrapper').setAttribute('style', 'max-width:' + jcarousel_width + 'px;');
                document.getElementById('ribbon-map-wrapper').setAttribute('style', 'visibility:visible;');
                $('.jcarousel').jcarousel('reload');
            } else {
                document.getElementById('ribbon-map-wrapper').setAttribute('style', 'visibility:hidden;');
                document.getElementById('jcarousel-wrapper').setAttribute('style', 'max-width:0px;');
                document.getElementById('ribbon-map').removeAttribute('style');
            }
        }

        function OnThumbClick(Id) {
            markers.zoomToShowLayer(MarkerClusterList[Id], function () {
                map.panTo(MarkerClusterList[Id].getLatLng());
                MarkerClusterList[Id].togglePopup();
            });
        }

        function removeChildren(params) {
            var parentId = params.parentId;

            var childNodes = document.getElementById(parentId).childNodes;
            for (var i = childNodes.length - 1; i >= 0; i--) {
                var childNode = childNodes[i];
                childNode.parentNode.removeChild(childNode);
            }
        }

        function onLocationFound(e) {
            var radius = e.accuracy / 2;
            var str = "{'METERS_FROM_POINT'|@translate}";

            L.marker(e.latlng).addTo(map)
                .bindPopup(str.replace('%s', radius)).openPopup();

            L.circle(e.latlng, radius).addTo(map);
        }

        //function onLocationError(e) {
        //	alert(e.message);
        //}

        function cclose() {
            parent.$.colorbox.close();
        }

        map.on('locationfound', onLocationFound);
        //map.on('locationerror', onLocationError);

    </script>

    <script type="text/javascript">

        $(document).ready(function () {
            var jcarousel = $('.jcarousel');
            jcarousel
                .on('jcarousel:reload jcarousel:create', function () {
                    var width = jcarousel.innerWidth();

                    if (width >= 600) {
                        width = width / 3;
                    } else if (width >= 350) {
                        width = width / 2;
                    }

                    jcarousel.jcarousel('items').css('width', width + 'px');
                })
                .jcarousel({
                    wrap: 'circular'
                });

            $('.jcarousel-control-prev')
                .jcarouselControl({
                    target: '-=1'
                });

            $('.jcarousel-control-next')
                .jcarouselControl({
                    target: '+=1'
                });

            $('#dialog').dialog({ autoOpen: false, minHeight: 150, minWidth: 600 });

            $('#opener').click(function () {
                $('#dialog').dialog('open');
            });
            /**/
        });
    </script>
</body>
