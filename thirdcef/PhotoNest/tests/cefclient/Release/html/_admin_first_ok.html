<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>PhotoNest</title>
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/fontello/css/fontello.css" />
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/fonts/open-sans/open-sans.css" />
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/u3.theme.css" />
    <style type="text/css">
        html, body {
            user-select: none;
            background-color: #fff;
        }

        li {
            padding: 5px;
        }

        #photosAddContent {
            width: 600px;
            font-size: 15px;
        }

        .RenameTagPopInContainer {
            max-width: 1140px;
            display: flex;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -80%);
            text-align: left;
            padding: 20px;
            flex-direction: column;
            border-radius: 15px;
            align-items: center;
            width: 90%;
        }
    </style>
</head>
<body>
    <div class="RenameTagPopInContainer">
        <div id="photosAddContent">
            <div id="infos1" class="infos">
                <ul>
                    <li> <i class="eiw-icon2 icon-ok"></i>{$nb} {'photos added to the album'|@translate}<span></span></li>
                    <li class="toosmall" style="display: none;"><span style="color: #f22;"></span></li>
                </ul>
            </div>
            <p class="afterUploadActions" style="margin: 15px;">
                <a style="font-size:17px;" id="visit" class="icon-left-open" href="javascript:;" onclick="location.replace('./a.html');return false;"> {'Visit the PhotoNest'|@translate}</a>
            </p>
        </div>
    </div>

    <script type="text/javascript" src="./templ/themes/default/js/jquery.min.js"></script>
    <script type="text/javascript">
        var _err30 = "{$err30}";
        var _err40 = "{$err40}";
        var _msg30 = " {'photos filetype not allowed'|@translate}";
        var _msg40 = " {'photos too small'|@translate}";

        $(document).ready(function () {
            var t2 = "";
            if (_err40 != "0") {
                t2 += _err40 + _msg40;
            }
            if (_err30 != "0") {
                if (t2 != "") {
                    t2 += ", ";
                }
                t2 += _err30 + _msg30;
            }
            if (t2 != "") {
                $(".toosmall span").html(t2);
                $(".toosmall").show();
            }
        });
    </script>
</body>
</html>
