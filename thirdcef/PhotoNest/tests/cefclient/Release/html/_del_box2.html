<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>PhotoNest</title>
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/fontello/css/fontello.css" />
    <link rel="stylesheet" type="text/css" href="./templ/admin/themes/default/fonts/open-sans/open-sans.css" />
    <link rel="stylesheet" type="text/css" href="./templ/themes/default/u3.black.css" />

    <style type="text/css">
        .RenameTagPopInContainer {
            display: flex;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -48%);
            text-align: left;
            padding: 20px;
            flex-direction: column;
            border-radius: 15px;
            align-items: center;
            width: 90%;
            background-color: white;
        }

        .RenameTagPopInContainer {
            margin-top: -32px;
        }

        .RenameTagInputContainer {
            margin-bottom: 15px;
        }

        .DeleteAlbumSubmit {
            background-color: #e74c3c;
            color: #fff;
        }

        .DeleteAlbumSubmit {
            cursor: pointer;
            font-weight: bold;
            padding: 10px;
            margin: 20px;
            font-size: 1em;
            margin-bottom: 0;
        }

        .DeleteAlbumSubmit {
            border-radius: 4px;
            transition: .1s;
        }

        .DeleteAlbumSubmit, .RenameAlbumSubmit {
            margin-right: 10px;
            padding: 10px 20px;
        }

        .DeleteAlbumCancel {
            background-color: #ecf0f1;
            color: #000;
            border-radius: 4px;
            transition: .1s;
        }

        .DeleteAlbumCancel {
            cursor: pointer;
            font-weight: bold;
            padding: 10px 20px;
            margin: 20px;
            margin-bottom: 20px;
            margin-left: 10px;
            font-size: 1em;
            margin-bottom: 0;
        }

        .DeleteAlbumCancel {
            cursor: pointer;
            font-weight: bold;
            padding: 10px 20px;
            margin: 20px;
            margin-bottom: 20px;
            margin-left: 10px;
            font-size: 1em;
            margin-bottom: 0;
        }

        .DeleteAlbumCancel {
            background-color: #ecf0f1;
            color: #000;
            border-radius: 4px;
            transition: .1s;
        }

            .DeleteAlbumCancel:hover {
                background: #bdc3c7;
            }

        .DeleteAlbumSubmit:hover {
            background: #c0392b;
        }

        #titie {
            height: 25px;
            word-break: break-all;
            font-size: 1.7em;
            padding: 8px 16px;
            font-weight: bold;
            color: #000000;
            margin-bottom: 10px;
            margin-top: 15px;
            text-align: center;
        }

        .DeleteAlbumSubmit, .DeleteAlbumCancel {
            display: inline-block;
        }

        .DeleteIconTitle {
            color: #000000;
            font-size: 1.7em;
            font-weight: bold;
            margin-bottom: 10px;
            margin-top: 10px;
            text-align: center;
            overflow: hidden;
            white-space: nowrap;
            max-width: 500px;
            text-overflow: ellipsis;
            height: 25px;
        }

        .jconfirm-content {
            text-align: center;
            font-size: 15px;
            color: #777;
            margin-bottom: 25px;
            overflow: hidden;
            white-space: nowrap;
            max-width: 500px;
            text-overflow: ellipsis;
        }
    </style>
</head>
<body id="theColorPage" style="min-width: 300px; background-color:#fff;">
    <div class="DeleteAlbumPopInContainer">
        <div class="RenameTagPopInContainer">
            <div class="DeleteIconTitle">
                <span>{'Delete'|@translate}</span>
            </div>
            <div class="RenameTagInputContainer" style="text-align: center;">
                <div class="jconfirm-content" id="fname0"></div>
            </div>
            <div class="DeleteAlbumFormValidation">
                <div class="DeleteAlbumSubmit" onclick="btn_del_imgs();return false;">
                    <span>{'Confirm deletion'|@translate}</span>
                </div>

                <div class="DeleteAlbumCancel" onclick="cancel_del_img();return false;">
                    <span>{'Cancel'|@translate}</span>
                </div>
            </div>
        </div>
    </div>
    <script type="text/javascript" src="./templ/themes/default/js/jquery.min.js"></script>
    <script type="text/javascript">
        var _ids = "{$ids}";
        var _idx = "{$idx}";
        var _type = "{$type}";
        var _artid = "{$artid}";
        var _nb = "{$total}";
        var _filename = "{$filename}";
        var _file1 = "{'Are you sure you want to move this file to the Recycle Bin?'|@translate}";
        var _files = "{'Are you sure you want to move these files to the Recycle Bin?'|@translate}";
        var _file3 = "{'Are you sure you want to remove this photo from the current collection?'|@translate}";

        $(document).ready(function () {
            var title = _file1;
            if (_type == "0") {
            }
            else if (_type == "7") {
                title = _file3;
            }
            else {
                if (_nb > 1) {
                    title = _files;
                    title = title.replace("999", _nb);
                }
            }
            $("#fname0").html(title);
        });

        function btn_del_imgs() {
            var url = "./delbox.html?act=index.delimg&ids=" + _ids + "&type=" + _type + "&artid=" + _artid;
            if (_type == "0") {
                url = "./delbox.html?act=index.delimg&idx=" + _idx + "&type=" + _type;
            }

            window.cefQuery({
                request: 'Prompt.q.disabledrag:0'
            });

            $.get(url, function (data, state) {
                var info = $.parseJSON(data);
                if (info.stat == "ok") {
                    if (_type == "0") {
                        //viewer
                        if (info.path == "") {
                            parent.window.location = "./view.html";
                        }
                        else {
                            parent.window.location = "./view.html?path=" + info.path;
                        }
                    }
                    else if (_type == "1") {
                        //index
                        parent.window.location.reload();
                    }
                    else if (_type == "2") {
                        //picture
                        parent.vr_del();
                        parent.$.colorbox.close();
                    }
                    else if (_type == "7") {
                        //art_zoom
                        parent.window.location.replace("./index.html?act=index.zoom&ids=" + info.ids + "&artid=" + info.artid);
                    }
                    else if (_type == "9") {
                        //batch
                        parent.window.location.reload();
                    }
                    else {
                        //cbox_edit
                        parent.parent._cbox_change = 2;
                        parent.parent.$.colorbox.close();
                    }
                }
            });
        }

        function cancel_del_img() {
            parent.$.colorbox.close();
        }
    </script>
</body>
</html>
